name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test with coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test

  # Auto-deploy is left to you: add your host's deploy step here, gated on the test job and on pushes to main.
  deploy-placeholder:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests passed on main. Add your deploy command here (for example Render or Railway deploy hook)."
